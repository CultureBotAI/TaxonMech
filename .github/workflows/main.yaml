name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  # Required checks report on every PR and on the combined queue commit.
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Updated PR heads supersede old runs; queue and main verdicts complete independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qc:
    runs-on: ubuntu-latest
    env:
      RECORD_REVIEW_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.event.before }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          # Recursive discovery over the complete corpus exceeds the action's call stack.
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      # Keep one executable definition of QC: lint, docs stats, raw-data
      # provenance, tests, history records, closed-schema validation, corpus
      # reproduction from data/raw/, generated-site drift, corpus report.
      - name: Validate structured review contract
        run: |
          test -n "$RECORD_REVIEW_BASE"
          git cat-file -e "$RECORD_REVIEW_BASE^{commit}"
          uv run pytest -q tests/test_record_review_contract.py

      - name: Run the authoritative quality gate
        run: uv run python scripts/run_qc.py

      - name: Upload validation failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-failures
          path: reports/
          if-no-files-found: ignore
