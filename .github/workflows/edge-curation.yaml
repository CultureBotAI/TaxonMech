name: Edge curation native adapter

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  native-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CultureBotAI/culturebotai-claw
          ref: 6141da81dc521d776e1ebcff1c4e63824313a9a1
          path: claw-contract
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
      - name: Install native runtime
        run: uv sync --frozen
      - name: Verify shared contract source pin
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/claw-contract/src
        run: uv run --frozen python scripts/adhoc/check_edge_contract_pin_20261107.py --claw-root claw-contract
      - name: Require native adapter integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/claw-contract/src
          REQUIRE_EDGE_CONTRACT: "1"
        run: uv run --frozen --with pytest python -m pytest tests/test_edge_curation.py tests/test_edge_links.py tests/test_edge_publication.py -q
