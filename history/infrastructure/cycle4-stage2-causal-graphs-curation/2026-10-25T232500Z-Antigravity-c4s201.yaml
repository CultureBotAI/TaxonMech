    PMID:2509430, PMID:1846779), Methanocaldococcus jannaschii (NCBITaxon:2190,
    NCBITaxon:243232; adding edges e9, e10, e11 linking mcrA UniProtKB:Q58256, mcrB
    UniProtKB:Q58252, and mcrG UniProtKB:Q58255 via causally upstream of or within
    RO:0002418 to methanogenesis GO:0015948, PMID:9367957), Cryptococcus deuterogattii
    (NCBITaxon:1859096, NCBITaxon:294750; adding edge e6 linking lac1 UniProtKB:A0A095CIC4
    via causally upstream of or within RO:0002418 to melanin_biosynthesis GO:0042438,
    PMID:15643074), Cryptococcus deneoformans (NCBITaxon:40410, NCBITaxon:283643;
    adding edge e4 linking lac1 UniProtKB:Q55P57 via causally upstream of or within
    RO:0002418 to melanin_biosynthesis GO:0042438, PMID:8760791), and Cryptococcus
    neoformans (NCBITaxon:5207, NCBITaxon:235443; adding edge e4 linking lac1
    UniProtKB:J9VY90 via causally upstream of or within RO:0002418 to melanin_biosynthesis
    GO:0042438, PMID:15381117), increasing total evidence-backed causal edges from
    110 to 127 across the 15 curated species and reference-proteome strain records.
    Regenerated the 13 affected TaxonRecord YAML files, 13 pages/taxon-details/<bucket>.json.gz
    shards, and README.md corpus statistics, and verified LinkML strict validation,
    OAK ID-label correspondence, offline UniProtKB reference proteome validation,
    and record-review contracts.'
