identifier: NCBITaxon:224308
causal_graphs:
- graph_id: endospore_formation
  title: KinA/Spo0A-regulated endospore formation
  description: >-
    Master regulatory mechanism of endospore formation in Bacillus subtilis
    subsp. subtilis str. 168, where sporulation histidine kinase KinA
    (BSU13990 in reference proteome UP:UP000001570) initiates the
    multicomponent phosphorelay that phosphorylates Stage 0 sporulation protein
    A (Spo0A, BSU24220) to activate sporulation gene expression and confer the
    spore-forming phenotype.
  nodes:
  - node_id: taxon
    label: Bacillus subtilis subsp. subtilis str. 168
    node_type: TAXON
    grounding: NCBITaxon:224308
  - node_id: kinA
    label: Sporulation kinase A (kinA)
    node_type: GENE_OR_PROTEIN
    grounding: UniProtKB:P16497
