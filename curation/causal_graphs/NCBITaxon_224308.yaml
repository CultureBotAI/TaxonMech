  edges:
  - edge_id: e1
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: kinA
    evidence:
    - reference: PMID:9384377
      notes: >-
        Complete genome sequence of Bacillus subtilis subsp. subtilis str. 168
        identifying kinA (BSU13990) as the primary sporulation histidine kinase.
    - reference: PMID:2509430
      notes: >-
        Characterization of the Bacillus subtilis kinA (spoIIJ) gene encoding
        the sporulation protein kinase.
  - edge_id: e2
    subject: kinA
    predicate: enables
    predicate_id: RO:0002327
    object: sensor_kinase_activity
    evidence:
    - reference: PMID:2509430
      notes: >-
        Purified KinA autophosphorylates with ATP and catalyzes phosphoryl
        transfer to sporulation response regulators Spo0F and Spo0A.
  - edge_id: e3
    subject: sensor_kinase_activity
    predicate: positively regulates
    predicate_id: RO:0002213
    object: phosphorelay_regulator_activity
    evidence:
    - reference: PMID:1987166
      notes: >-
        KinA-driven phosphoryl flux through the Spo0F/Spo0B phosphorelay
        activates Spo0A response regulator activity.
  - edge_id: e4
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: spo0A
    evidence:
    - reference: PMID:9384377
      notes: >-
        Complete genome sequence of Bacillus subtilis subsp. subtilis str. 168
        identifying spo0A (BSU24220) as the central sporulation regulator.
  - edge_id: e5
    subject: spo0A
    predicate: enables
    predicate_id: RO:0002327
    object: phosphorelay_regulator_activity
    evidence:
    - reference: PMID:1987166
      notes: >-
        Spo0A functions as the terminal phosphorelay response regulator
        phosphorylated via KinA/Spo0F/Spo0B to initiate sporulation.
  - edge_id: e6
    subject: phosphorelay_regulator_activity
    predicate: positively regulates
    predicate_id: RO:0002213
    object: endospore_formation
    evidence:
    - reference: PMID:14651647
      notes: >-
        Chromatin immunoprecipitation and microarray profiling demonstrate direct
        transcriptional activation of the sporulation initiation program by Spo0A~P.
  - edge_id: e7
    subject: endospore_formation
    predicate: has output
    predicate_id: RO:0002234
    object: spore_forming_trait
    evidence:
    - reference: PMID:14651647
      notes: >-
        Completion of the Spo0A-initiated sporulation developmental pathway
        yields dormant, heat-resistant endospores.
  - edge_id: e8
    subject: spo0A
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: endospore_formation
    evidence:
    - reference: PMID:14651647
      notes: >-
        Phosphorylated Spo0A directly binds and activates transcription of the
        sporulation initiation regulon required for endospore formation in
        Bacillus subtilis subsp. subtilis str. 168.
