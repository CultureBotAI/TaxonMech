causal_graphs:
- graph_id: endospore_formation
  title: Spo0A-regulated endospore formation
  description: >-
    Master regulatory mechanism of endospore formation in Bacillus subtilis
    subsp. subtilis str. 168, where phosphorylation of Stage 0 sporulation
    protein A (Spo0A, encoded by spo0A / BSU_24220 in reference proteome
    UP:UP000001570) via the multicomponent phosphorelay activates sporulation
    gene expression and confers the spore-forming phenotype.
