    organism_taxon_id: NCBITaxon:224308
    proteome_id: UP:UP000001570
    gene_symbol: kinA
    locus_tag: BSU13990
    sequence_length: 606
    sequence_crc64: A8BB97FE844B32EE
    sequence_version: 2
    entry_status: SWISS_PROT
  - node_id: spo0A
    label: Stage 0 sporulation protein A (spo0A)
    node_type: GENE_OR_PROTEIN
    grounding: UniProtKB:P06534
