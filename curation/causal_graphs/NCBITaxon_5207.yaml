causal_graphs:
- graph_id: melanin_biosynthesis
  title: Lac1-mediated melanin biosynthesis
  description: >-
    Cell-wall melanin biosynthesis in the basidiomycete yeast Cryptococcus
    neoformans (var. grubii serotype A, reference strain H99, proteome
    UP:UP000010091), where cell-wall-associated diphenol oxidase Laccase-1
    (LAC1 / CNAG_03465, UniProtKB:J9VY90) oxidizes catecholamines such as
    L-DOPA to synthesize protective melanin pigment.
