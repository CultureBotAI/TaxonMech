identifier: NCBITaxon:5207
causal_graphs:
- graph_id: melanin_biosynthesis
  title: Lac1-mediated melanin biosynthesis
  description: >-
    Cell-wall melanin biosynthesis in the basidiomycete yeast Cryptococcus
    neoformans (var. grubii serotype A, reference strain H99, proteome
    UP:UP000010091), where cell-wall-associated diphenol oxidase Laccase-1
    (LAC1 / CNAG_03465, UniProtKB:J9VY90) oxidizes catecholamines such as
    L-DOPA to synthesize protective melanin pigment.
  nodes:
  - node_id: taxon
    label: Cryptococcus neoformans
    node_type: TAXON
    grounding: NCBITaxon:5207
  - node_id: lac1
    label: Laccase-1 (LAC1)
    node_type: GENE_OR_PROTEIN
    grounding: UniProtKB:J9VY90
    xrefs:
    - EC:1.10.3.2
    organism_taxon_id: NCBITaxon:235443
    proteome_id: UP:UP000010091
    gene_symbol: LAC1
    locus_tag: CNAG_03465
    sequence_length: 624
    sequence_crc64: CACD3577C439C6C2
    sequence_version: 1
    entry_status: SWISS_PROT
  - node_id: lac2
    label: Laccase-2 (LAC2)
    node_type: GENE_OR_PROTEIN
    grounding: UniProtKB:J9VQZ4
    xrefs:
    - EC:1.10.3.2
    organism_taxon_id: NCBITaxon:235443
    proteome_id: UP:UP000010091
    gene_symbol: LAC2
    locus_tag: CNAG_03464
    sequence_length: 594
    sequence_crc64: E71D60C20BD6C102
    sequence_version: 2
    entry_status: SWISS_PROT
  - node_id: bzp4
    label: BZIP domain-containing transcription factor BZP4 (BZP4)
    node_type: GENE_OR_PROTEIN
    grounding: UniProtKB:J9VQ26
    organism_taxon_id: NCBITaxon:235443
    proteome_id: UP:UP000010091
    gene_symbol: BZP4
    locus_tag: CNAG_03346
    sequence_length: 341
    sequence_crc64: 8E34C8525C009CFC
    sequence_version: 2
    entry_status: SWISS_PROT
  - node_id: laccase_activity
    label: hydroquinone:oxygen oxidoreductase activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0052716
  - node_id: melanin_biosynthesis
    label: melanin biosynthetic process
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0042438
  edges:
  - edge_id: e1
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: lac1
    evidence:
    - reference: PMID:24743168
      notes: >-
        Reference genome and transcriptome assembly of Cryptococcus neoformans
        var. grubii strain H99 identifying LAC1 (CNAG_03465).
    - reference: PMID:11500433
      notes: >-
        Immunoelectron microscopy and cell-fractionation studies establish that
        Cryptococcus neoformans Lac1 is localized to the cell wall.
  - edge_id: e2
    subject: lac1
    predicate: enables
    predicate_id: RO:0002327
    object: laccase_activity
    evidence:
    - reference: PMID:11500433
      notes: >-
        Cell-wall-associated Lac1 catalyzes copper-dependent diphenol oxidase
        (laccase, EC:1.10.3.2) activity.
  - edge_id: e3
    subject: laccase_activity
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: melanin_biosynthesis
    evidence:
    - reference: PMID:15381117
      notes: >-
        Lac1-catalyzed oxidation of exogenous catecholamines synthesizes
        cell-wall melanin that protects Cryptococcus neoformans from oxidative
        host defenses.
  - edge_id: e4
    subject: lac1
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: melanin_biosynthesis
    evidence:
    - reference: PMID:15381117
      notes: >-
        Disruption of LAC1 (CNAG_03465, UniProtKB:J9VY90) drastically
        compromises melanin production, establishing Lac1 as the primary
        diphenol oxidase driving cell-wall melanin biosynthesis in
        Cryptococcus neoformans.
  - edge_id: e5
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: lac2
    evidence:
    - reference: PMID:24743168
      notes: >-
        Reference genome and transcriptome assembly of Cryptococcus neoformans
        var. grubii strain H99 identifying LAC2 (CNAG_03464) adjacent to LAC1
        on chromosome 4.
    - reference: PMID:15643075
      notes: >-
        Characterization of Cryptococcus neoformans LAC2 (CNAG_03464) encoded
        8 kb adjacent to LAC1 and differentially expressed under oxidative and
        glucose-starvation conditions.
  - edge_id: e6
    subject: lac2
    predicate: enables
    predicate_id: RO:0002327
    object: laccase_activity
    evidence:
    - reference: PMID:15643075
      notes: >-
        Cryptococcus neoformans Lac2 (UniProtKB:J9VQZ4, EC:1.10.3.2) is a
        functional copper-dependent diphenol oxidase (laccase) paralogous to
        Lac1.
    - reference: PMID:15381117
      notes: >-
        Comparative analysis of the Cryptococcus neoformans laccase gene family
        establishing diphenol oxidase activity for both Lac1 and Lac2.
  - edge_id: e7
    subject: lac2
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: melanin_biosynthesis
    evidence:
    - reference: PMID:15643075
      notes: >-
        LAC2 encodes a second functional laccase that contributes to catecholamine
        oxidation and melanin biosynthesis in Cryptococcus neoformans.
    - reference: PMID:15643074
      notes: >-
        cAMP-dependent signaling co-regulates transcription of the Cryptococcus
        neoformans melanin biosynthesis genes LAC1 and LAC2.
  - edge_id: e8
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: bzp4
    evidence:
    - reference: PMID:24743168
      notes: >-
        Reference genome and transcriptome assembly of Cryptococcus neoformans
        var. grubii strain H99 identifying BZP4 (CNAG_03346).
    - reference: PMID:25849373
      notes: >-
        Systematic functional profiling of 155 Cryptococcus neoformans
        transcription factors identifying the bZIP regulator Bzp4
        (CNAG_03346).
  - edge_id: e9
    subject: bzp4
    predicate: positively regulates
    predicate_id: RO:0002213
    object: lac1
    evidence:
    - reference: PMID:25849373
      notes: >-
        Deletion of BZP4 (CNAG_03346) impairs LAC1 induction under nutrient
        starvation and reduces melanin production in Cryptococcus neoformans.
    - reference: PMID:31575776
      notes: >-
        Nutrient deprivation triggers nuclear translocation of Bzp4 to induce
        LAC1 transcription in the core melanin regulatory network of
        Cryptococcus neoformans.
  - edge_id: e10
    subject: bzp4
    predicate: positively regulates
    predicate_id: RO:0002213
    object: melanin_biosynthesis
    evidence:
    - reference: PMID:25849373
      notes: >-
        Bzp4 is a core transcriptional activator required for wild-type
        catecholamine oxidation and cell-wall melanin biosynthesis in
        Cryptococcus neoformans.
    - reference: PMID:31575776
      notes: >-
        Epistatic and transcriptional network analysis establishes Bzp4 as a
        core transcription factor driving LAC1 expression and melanization in
        Cryptococcus neoformans.
