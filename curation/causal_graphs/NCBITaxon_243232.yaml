causal_graphs:
- graph_id: hydrogenotrophic_methanogenesis
  title: McrABG-catalyzed hydrogenotrophic methanogenesis
  description: >-
    Terminal step of hydrogenotrophic methanogenesis in Methanocaldococcus
    jannaschii DSM 2661, catalyzed by the heterohexameric methyl-coenzyme M
    reductase I complex composed of subunits alpha (McrA, MJ0846), beta (McrB,
    MJ0842), and gamma (McrG, MJ0845) in reference proteome UP:UP000000805,
    which reduces methyl-coenzyme M with coenzyme B to release methane.
