causal_graphs:
- graph_id: hydrogenotrophic_methanogenesis
  title: McrA-catalyzed hydrogenotrophic methanogenesis
  description: >-
    Terminal step of hydrogenotrophic methanogenesis in Methanocaldococcus
    jannaschii, catalyzed by methyl-coenzyme M reductase alpha subunit (McrA,
    encoded by mcrA / MJ_0846 in type strain JAL-1 = DSM 2661), which reduces
    methyl-coenzyme M with coenzyme B to release methane and the heterodisulfide
    CoM-S-S-CoB.
