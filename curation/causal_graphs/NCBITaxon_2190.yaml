identifier: NCBITaxon:2190
causal_graphs:
- graph_id: hydrogenotrophic_methanogenesis
  title: McrABG-catalyzed hydrogenotrophic methanogenesis
  description: >-
    Terminal step of hydrogenotrophic methanogenesis in Methanocaldococcus
    jannaschii, catalyzed by the heterohexameric methyl-coenzyme M reductase I
    complex composed of subunits alpha (McrA, MJ0846), beta (McrB, MJ0842), and
    gamma (McrG, MJ0845) in type strain JAL-1 = DSM 2661 (proteome
    UP:UP000000805), which reduces methyl-coenzyme M with coenzyme B to release
    methane and the heterodisulfide CoM-S-S-CoB.
