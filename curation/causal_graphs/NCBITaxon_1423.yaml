  - edge_id: e5
    subject: spo0A
    predicate: enables
    predicate_id: RO:0002327
    object: phosphorelay_regulator_activity
    evidence:
    - reference: PMID:1846779
      notes: >-
        Spo0A functions as the terminal phosphorelay response regulator
        phosphorylated via KinA/Spo0F/Spo0B to initiate sporulation.
  - edge_id: e6
    subject: phosphorelay_regulator_activity
    predicate: positively regulates
    predicate_id: RO:0002213
    object: endospore_formation
    evidence:
    - reference: PMID:14651647
      notes: >-
        Chromatin immunoprecipitation and microarray profiling demonstrate direct
        transcriptional activation of the sporulation initiation program by Spo0A~P.
  - edge_id: e7
    subject: endospore_formation
    predicate: has output
    predicate_id: RO:0002234
    object: spore_forming_trait
    evidence:
    - reference: PMID:14651647
      notes: >-
        Completion of the Spo0A-initiated sporulation developmental pathway
        yields dormant, heat-resistant endospores.
  - edge_id: e8
    subject: spo0A
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: endospore_formation
    evidence:
    - reference: PMID:14651647
      notes: >-
        Phosphorylated Spo0A directly binds and activates transcription of the
        sporulation initiation regulon required for endospore formation in
        Bacillus subtilis.
  - edge_id: e9
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: spo0F
    evidence:
    - reference: PMID:9384377
      notes: >-
        Complete genome sequence of Bacillus subtilis strain 168 identifying
        spo0F (BSU37130) encoding the intermediate sporulation response
        regulator Spo0F.
    - reference: PMID:3003689
      notes: >-
        Sequence characterization of the Bacillus subtilis spo0F gene and its
        response-regulator homology with spo0A.
  - edge_id: e10
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: spo0B
    evidence:
    - reference: PMID:9384377
      notes: >-
        Complete genome sequence of Bacillus subtilis strain 168 identifying
        spo0B (BSU27930) encoding sporulation initiation phosphotransferase B.
    - reference: PMID:6438629
      notes: >-
        Nucleotide sequence and transcriptional characterization of the Bacillus
        subtilis spo0B sporulation initiation gene.
  - edge_id: e11
    subject: kinA
    predicate: directly positively regulates
    predicate_id: RO:0002629
    object: spo0F
    evidence:
    - reference: PMID:1846779
      notes: >-
        Autophosphorylated sensor histidine kinase KinA directly transfers its
        phosphoryl group to the intermediate response regulator Spo0F.
    - reference: PMID:2509430
      notes: >-
        Purified KinA directly phosphorylates the sporulation response regulator
        Spo0F in the presence of ATP.
  - edge_id: e12
    subject: spo0F
    predicate: directly positively regulates
    predicate_id: RO:0002629
    object: spo0B
    evidence:
    - reference: PMID:1846779
      notes: >-
        Phosphorylated Spo0F~P serves as the direct phosphoryl donor to the
        Spo0B phosphotransferase in the sporulation initiation phosphorelay.
    - reference: PMID:10997904
      notes: >-
        Crystal structure of the Spo0F-Spo0B complex reveals the direct
        molecular recognition and phosphoryl transfer interface between Spo0F
        and Spo0B.
  - edge_id: e13
    subject: spo0B
    predicate: directly positively regulates
    predicate_id: RO:0002629
    object: spo0A
    evidence:
    - reference: PMID:1846779
      notes: >-
        Phosphorylated Spo0B~P catalyzes direct phosphoryl transfer to the
        terminal sporulation transcription factor Spo0A.
    - reference: PMID:9726997
      notes: >-
        Biochemical characterization of His-phosphorylated Spo0B demonstrates
        direct reversible phosphotransfer to Spo0A.
  - edge_id: e14
    subject: kinA
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: endospore_formation
    evidence:
    - reference: PMID:2509430
      notes: >-
        Sporulation histidine kinase KinA (UniProtKB:P16497) initiates the
        phosphorylation cascade required for entry into endospore formation in
        Bacillus subtilis.
    - reference: PMID:1846779
      notes: >-
        KinA supplies ATP-dependent phosphoryl flux into the Spo0F/Spo0B/Spo0A
        phosphorelay governing sporulation initiation.
  - edge_id: e15
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: kinB
    evidence:
    - reference: PMID:9384377
      notes: >-
        Complete genome sequence of Bacillus subtilis strain 168 identifying
        kinB (BSU31450) encoding the alternate transmembrane sporulation
        histidine kinase KinB.
    - reference: PMID:8497199
      notes: >-
        Identification and nucleotide sequence of the Bacillus subtilis kinB
        locus encoding a second histidine protein kinase required for
        sporulation initiation.
  - edge_id: e16
    subject: kinB
    predicate: enables
    predicate_id: RO:0002327
    object: sensor_kinase_activity
    evidence:
    - reference: PMID:8497199
      notes: >-
        Transmembrane histidine kinase KinB functions as an alternate
        phosphorelay sensor kinase that couples environmental signals to
        sporulation initiation.
  - edge_id: e17
    subject: kinB
    predicate: directly positively regulates
    predicate_id: RO:0002629
    object: spo0F
    evidence:
    - reference: PMID:8497199
      notes: >-
        KinB provides an alternate ATP-dependent phosphoryl input directly into
        the intermediate response regulator Spo0F of the sporulation
        phosphorelay.
  - edge_id: e18
    subject: kinB
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: endospore_formation
    evidence:
    - reference: PMID:8497199
      notes: >-
        Double-mutant analysis of kinA and kinB demonstrates that KinB-driven
        phosphoryl flux into the Spo0F/Spo0B/Spo0A phosphorelay initiates
        endospore formation in Bacillus subtilis.
  - edge_id: e19
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: spo0E
    evidence:
    - reference: PMID:9384377
      notes: >-
        Complete genome sequence of Bacillus subtilis strain 168 identifying
        spo0E (BSU13640) encoding the Spo0A~P-specific aspartyl-phosphate
        phosphatase Spo0E.
    - reference: PMID:2838724
      notes: >-
        Isolation and nucleotide sequence characterization of the Bacillus
        subtilis spo0E locus regulating sporulation initiation.
  - edge_id: e20
    subject: spo0E
    predicate: negatively regulates
    predicate_id: RO:0002212
    object: spo0A
    evidence:
    - reference: PMID:8127878
      notes: >-
        Purified Spo0E specifically dephosphorylates phosphorylated Spo0A~P,
        acting as a dedicated aspartyl-phosphate phosphatase checkpoint on the
        master sporulation regulator.
    - reference: PMID:12067336
      notes: >-
        Genetic and biochemical definition of the interaction surface on the
        Spo0A receiver domain recognized by the Spo0E aspartyl-phosphate
        phosphatase.
  - edge_id: e21
    subject: spo0E
    predicate: negatively regulates
    predicate_id: RO:0002212
    object: endospore_formation
    evidence:
    - reference: PMID:8127878
      notes: >-
        Spo0E-catalyzed dephosphorylation of Spo0A~P drains phosphoryl flux from
        the sporulation phosphorelay and inhibits entry into endospore
        formation.
    - reference: PMID:2838724
      notes: >-
        Overexpression or hypermorphic C-terminal truncation mutations of spo0E
        block sporulation initiation in Bacillus subtilis.
  - edge_id: e22
    subject: spo0F
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: endospore_formation
    evidence:
    - reference: PMID:1846779
      notes: >-
        Intermediate response regulator Spo0F (UniProtKB:P06628) is an essential
        phosphoryl carrier in the multicomponent phosphorelay governing entry
        into endospore formation in Bacillus subtilis.
    - reference: PMID:3003689
      notes: >-
        Genetic and sequence characterization of the Bacillus subtilis spo0F
        stage 0 sporulation locus required for initiation of endospore
        formation.
  - edge_id: e23
    subject: spo0B
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: endospore_formation
    evidence:
    - reference: PMID:1846779
      notes: >-
        Sporulation initiation phosphotransferase Spo0B (UniProtKB:P06535)
        relays phosphoryl groups from Spo0F~P to Spo0A to initiate endospore
        formation in Bacillus subtilis.
    - reference: PMID:6438629
      notes: >-
        Characterization of the Bacillus subtilis spo0B stage 0 sporulation gene
        essential for progression into endospore formation.
  - edge_id: e24
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: rapA
    evidence:
    - reference: PMID:9384377
      notes: >-
        Complete genome sequence of Bacillus subtilis strain 168 identifying
        rapA (BSU12430) encoding response regulator aspartate phosphatase A.
    - reference: PMID:8001132
      notes: >-
        Identification and characterization of the Bacillus subtilis rapA
        (spo0L) locus encoding a Spo0F~P-specific protein-aspartate phosphatase.
  - edge_id: e25
    subject: rapA
    predicate: negatively regulates
    predicate_id: RO:0002212
    object: spo0F
    evidence:
    - reference: PMID:8001132
      notes: >-
        Response regulator aspartate phosphatase RapA specifically
        dephosphorylates the intermediate sporulation response regulator Spo0F~P.
    - reference: PMID:11923303
      notes: >-
        Biochemical characterization of purified Bacillus subtilis RapA
        demonstrating direct binding and dephosphorylation of phosphorylated
        Spo0F~P.
  - edge_id: e26
    subject: rapA
    predicate: negatively regulates
    predicate_id: RO:0002212
    object: endospore_formation
    evidence:
    - reference: PMID:8001132
      notes: >-
        RapA-mediated dephosphorylation of Spo0F~P drains phosphoryl flux from
        the Spo0F/Spo0B/Spo0A phosphorelay and negatively regulates sporulation
        initiation in Bacillus subtilis.
    - reference: PMID:11923303
      notes: >-
        RapA phosphatase activity against Spo0F~P functions as an antagonizable
        negative checkpoint on entry into endospore formation.
