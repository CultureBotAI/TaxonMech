      notes: >-
        KinA-driven phosphoryl flux through the Spo0F/Spo0B phosphorelay
        activates Spo0A response regulator activity.
  - edge_id: e4
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: spo0A
    evidence:
    - reference: PMID:9384377
