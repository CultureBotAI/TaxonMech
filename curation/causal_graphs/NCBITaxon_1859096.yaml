    deuterogattii (reference strain R265, proteome UP:UP000007805), where
    capsular-associated protein Cap59 (CNBG_0606) mediates polysaccharide
    capsule organization and laccase-1 Lac1 (CNBG_2144) catalyzes diphenol
    oxidation during cell-wall melanin biosynthesis.
