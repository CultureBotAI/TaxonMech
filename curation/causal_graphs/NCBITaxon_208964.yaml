identifier: NCBITaxon:208964
causal_graphs:
- graph_id: pyocyanin_biosynthesis
  title: PhzM/PhzS-mediated pyocyanin biosynthesis
  description: >-
    Terminal steps of phenazine and pyocyanin biosynthesis in Pseudomonas
    aeruginosa PAO1, where phenazine-1-carboxylate N-methyltransferase PhzM
    (PA4209) and 5-methylphenazine-1-carboxylate 1-monooxygenase PhzS (PA4217)
    in reference proteome UP:UP000002438 convert phenazine-1-carboxylic acid
    into pyocyanin.
  nodes:
  - node_id: taxon
    label: Pseudomonas aeruginosa PAO1
    node_type: TAXON
    grounding: NCBITaxon:208964
  - node_id: phzM
    label: Phenazine-1-carboxylate N-methyltransferase (phzM)
    node_type: GENE_OR_PROTEIN
    grounding: UniProtKB:Q9HWH2
    xrefs:
    - EC:2.1.1.327
    organism_taxon_id: NCBITaxon:208964
    proteome_id: UP:UP000002438
    gene_symbol: phzM
    locus_tag: PA4209
    sequence_length: 334
    sequence_crc64: 27D9717ECA12A1B5
    sequence_version: 1
    entry_status: SWISS_PROT
  - node_id: phzS
    label: 5-methylphenazine-1-carboxylate 1-monooxygenase (phzS)
    node_type: GENE_OR_PROTEIN
    grounding: UniProtKB:Q9HWG9
