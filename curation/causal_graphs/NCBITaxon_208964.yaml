- graph_id: pyocyanin_biosynthesis
  title: PhzM/PhzS-mediated pyocyanin biosynthesis
  description: >-
    Terminal steps of phenazine and pyocyanin biosynthesis in Pseudomonas
    aeruginosa PAO1, where phenazine-1-carboxylate N-methyltransferase PhzM
    (PA4209) and 5-methylphenazine-1-carboxylate 1-monooxygenase PhzS (PA4217)
    in reference proteome UP:UP000002438 convert phenazine-1-carboxylic acid
    into pyocyanin.
