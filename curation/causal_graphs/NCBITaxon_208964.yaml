    grounding: GO:0002047
  - node_id: pyocyanin
    label: pyocyanine
    node_type: CHEMICAL
    grounding: CHEBI:8653
  edges:
  - edge_id: e1
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: phzM
    evidence:
    - reference: PMID:10984043
      notes: >-
        Complete genome sequence of Pseudomonas aeruginosa PAO1 identifying
        phzM (PA4209) adjacent to the phzA1-G1 phenazine biosynthetic operon.
  - edge_id: e2
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: phzS
    evidence:
    - reference: PMID:10984043
      notes: >-
        Complete genome sequence of Pseudomonas aeruginosa PAO1 identifying
        phzS (PA4217) downstream of the phzA1-G1 phenazine biosynthetic operon.
  - edge_id: e3
    subject: phzM
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: phenazine_biosynthesis
    evidence:
    - reference: PMID:11591691
      notes: >-
        PhzM catalyzes N-methylation of phenazine-1-carboxylic acid to
        5-methylphenazine-1-carboxylate betaine in pyocyanin biosynthesis.
    - reference: PMID:17253782
      notes: >-
        Crystal structure and biochemical characterization of Pseudomonas
        aeruginosa PAO1 PhzM (UniProtKB:Q9HWH2) demonstrating
        S-adenosyl-L-methionine dependent phenazine N-methyltransferase
        activity.
  - edge_id: e4
    subject: phzS
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: phenazine_biosynthesis
    evidence:
    - reference: PMID:11591691
      notes: >-
        PhzS catalyzes hydroxylative decarboxylation of
        5-methylphenazine-1-carboxylate betaine to yield pyocyanin.
    - reference: PMID:18416536
      notes: >-
        Crystal structure of Pseudomonas aeruginosa PAO1 PhzS (UniProtKB:Q9HWG9)
        establishing its FAD-dependent monooxygenase active site in pyocyanin
        biosynthesis.
  - edge_id: e5
    subject: phenazine_biosynthesis
    predicate: has primary output
    predicate_id: RO:0004008
    object: pyocyanin
    evidence:
    - reference: PMID:11591691
      notes: >-
        Combined action of PhzM and PhzS in the phenazine biosynthetic pathway
        produces the blue-green redox-active phenazine pigment pyocyanin.
