identifier: NCBITaxon:294750
causal_graphs:
- graph_id: capsule_and_melanin_virulence
  title: Cap59/Lac1-mediated capsule organization and melanin biosynthesis
  description: >-
    Core virulence factor pathways in Cryptococcus deuterogattii R265 (reference
    proteome UP:UP000029445), where CAP59-family alpha-1,3-mannosyltransferase
    (CNBG_1207) mediates polysaccharide capsule organization and acidic laccase
    (CNBG_4942) catalyzes diphenol oxidation during cell-wall melanin
    biosynthesis.
  nodes:
  - node_id: taxon
    label: Cryptococcus deuterogattii R265
    node_type: TAXON
    grounding: NCBITaxon:294750
  - node_id: cap59
    label: Alpha-1,3-mannosyltransferase (CNBG_1207)
    node_type: GENE_OR_PROTEIN
    grounding: UniProtKB:A0A095C6P1
    organism_taxon_id: NCBITaxon:294750
    proteome_id: UP:UP000029445
    locus_tag: CNBG_1207
    sequence_length: 457
    sequence_crc64: 1EE9B113AD99C774
    sequence_version: 1
    entry_status: TREMBL
  - node_id: lac1
    label: Acidic laccase (CNBG_4942)
    node_type: GENE_OR_PROTEIN
    grounding: UniProtKB:A0A095CIC4
    organism_taxon_id: NCBITaxon:294750
    proteome_id: UP:UP000029445
    locus_tag: CNBG_4942
    sequence_length: 640
    sequence_crc64: 0D78281EB329FEB4
    sequence_version: 1
    entry_status: TREMBL
  - node_id: capsule_organization
    label: external encapsulating structure organization
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0045229
  - node_id: laccase_activity
    label: hydroquinone:oxygen oxidoreductase activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0052716
  - node_id: melanin_biosynthesis
    label: melanin biosynthetic process
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0042438
  edges:
  - edge_id: e1
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: cap59
    evidence:
    - reference: PMID:21304167
      notes: >-
        Reference genome assembly and annotation of Cryptococcus deuterogattii
        strain R265 identifying CAP59-family alpha-1,3-mannosyltransferase
        CNBG_1207.
  - edge_id: e2
    subject: cap59
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: capsule_organization
    evidence:
    - reference: PMID:8007987
      notes: >-
        CAP59 is required for extracellular glucuronoxylomannan polysaccharide
        capsule export and organization in pathogenic Cryptococcus species.
  - edge_id: e3
    subject: taxon
    predicate: expresses
    predicate_id: RO:0002292
    object: lac1
    evidence:
    - reference: PMID:21304167
      notes: >-
        Reference genome assembly and annotation of Cryptococcus deuterogattii
        strain R265 identifying acidic laccase CNBG_4942.
  - edge_id: e4
    subject: lac1
    predicate: enables
    predicate_id: RO:0002327
    object: laccase_activity
    evidence:
    - reference: PMID:15643074
      notes: >-
        Cryptococcus laccase encodes the major cell-wall-associated diphenol
        oxidase regulated by the cAMP/PKA signaling pathway.
  - edge_id: e5
    subject: laccase_activity
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: melanin_biosynthesis
    evidence:
    - reference: PMID:15643074
      notes: >-
        Laccase activity oxidizes exogenous catecholamines such as L-DOPA to
        synthesize protective cell-wall melanin pigment.
  - edge_id: e6
    subject: lac1
    predicate: causally upstream of or within
    predicate_id: RO:0002418
    object: melanin_biosynthesis
    evidence:
    - reference: PMID:15643074
      notes: >-
        Acidic laccase CNBG_4942 (UniProtKB:A0A095CIC4) directly mediates
        diphenol oxidation during cell-wall melanin biosynthesis in
        Cryptococcus deuterogattii R265.
