  title: Lac1-mediated melanin biosynthesis
  description: >-
    Cell-wall melanin biosynthesis in Cryptococcus deneoformans B-3501A, where
    diphenol oxidase Laccase-1 (LAC1 / CNBG3550, UniProtKB:Q55P57) oxidizes
    exogenous diphenols and catecholamines to synthesize protective melanin
    pigment.
