    -> 'Acetobacterium woodii A' on NCBITaxon:33952) into fake trinomials published
    as EXACT_SYNONYM (#65).
  disposition: Carry forward to Cycle 9 Stage 5 (resolve_review_findings); requires
    updating GTDB synonym formatting in src/taxonmech/seed.py and regenerating affected
    TaxonRecord YAML files (#65).
