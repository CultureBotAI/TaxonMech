- finding_id: overlay-readme-example-missing-required-taxon-expresses-protein-edge
  status: open
  issue_url: https://github.com/CultureBotAI/TaxonMech/issues/224
  summary: 'In curation/causal_graphs/README.md, lines 14-72 (''## Overlay File Contract'')
    provide a canonical YAML overlay example for NCBITaxon:562 defining node_id: taxon
    (TAXON, grounding: NCBITaxon:562), node_id: lacZ (GENE_OR_PROTEIN, grounding:
    UniProtKB:P00722), and node_id: lactose-hydrolysis (BIOLOGICAL_PROCESS, grounding:
    GO:0019513), with edges containing only taxon-capable-of-lactose-hydrolysis (taxon
    -> lactose-hydrolysis, RO:0002215) and lacz-capable-of-lactose-hydrolysis (lacZ
    -> lactose-hydrolysis, RO:0002215). Because Cycle 8 Stage 6 (#224, PR #225) extended
    causal_graph_provenance_problems() in scripts/check_provenance.py (lines 167-189,
    documented at curation/causal_graphs/README.md lines 196-199) to require every
    GENE_OR_PROTEIN node in curation/causal_graphs/*.yaml to have an incoming RO:0002292
    (expresses) edge from a host TAXON node (grounding == tid), causal_graph_provenance_problems()
    rejects that example with "GENE_OR_PROTEIN node is not linked from host TAXON
    node via RO:0002292 (expresses)" (#224, #78).'
  disposition: 'Carry forward to Cycle 9 Stage 5 (resolve_review_findings) for direct
    documentation and regression-test remediation in curation/causal_graphs/README.md
    and tests/test_causal_graph_overlays.py (#224, #78).'
