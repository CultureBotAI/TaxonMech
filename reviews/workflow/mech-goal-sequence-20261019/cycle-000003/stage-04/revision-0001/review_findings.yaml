    genome total as the taxon's GTDB GENOME attestation (#118), and across 8,587 pooled
    GTDB records (209,540 rows, including NCBITaxon:562 and NCBITaxon:3121604) lines
    522-524 emit a note stating the reverse of kg-microbe's broadMatch direction (#119).
  disposition: 'Carry forward to Cycle 3 Stage 5 (resolve_review_findings); requires
    updating pooled GTDB broadMatch handling in src/taxonmech/seed.py and regenerating
    8,587 TaxonRecord YAML files (#118, #119).'
