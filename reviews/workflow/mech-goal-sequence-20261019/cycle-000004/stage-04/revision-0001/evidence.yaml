  disposition: 'Carry forward to Cycle 4 Stage 5 (resolve_review_findings); requires updating pooled GTDB
    broadMatch handling in src/taxonmech/seed.py and regenerating 8,587 TaxonRecord YAML files (#118,
    #119).'
