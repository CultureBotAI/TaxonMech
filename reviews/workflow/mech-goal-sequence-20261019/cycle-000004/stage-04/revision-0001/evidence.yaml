    pages (#124, #63).'
- finding_id: gtdb-polyphyly-suffix-synonym-mangling
  status: open
  issue_url: https://github.com/CultureBotAI/TaxonMech/issues/65
  carried_from: gtdb-polyphyly-suffix-synonym-mangling
  summary: src/taxonmech/seed.py line 529 replaces all underscores in GTDB labels with spaces via m['gtdb_label'].split('__',
    1)[-1].replace('_', ' '), mangling 15,704 polyphyly-suffixed GTDB cluster names (e.g., s__Campylobacter_F_sputorum
    -> 'Campylobacter F sputorum' on NCBITaxon:206 and s__Acetobacterium_woodii_A -> 'Acetobacterium woodii
    A' on NCBITaxon:33952) into fake trinomials published as EXACT_SYNONYM (#65).
  disposition: Carry forward to Cycle 4 Stage 5 (resolve_review_findings); requires updating GTDB synonym
    formatting in src/taxonmech/seed.py and regenerating affected TaxonRecord YAML files (#65).
- finding_id: gtdb-pooled-broadmatch-attestation-and-note
  status: open
  issue_url: https://github.com/CultureBotAI/TaxonMech/issues/118
  carried_from: gtdb-pooled-broadmatch-attestation-and-note
  summary: On 6,335 pooled-only GTDB records (e.g., NCBITaxon:3121604 data/taxa/bacteria/acidaminobacteraceae_bacterium.yaml),
    src/taxonmech/seed.py (lines 636-650) emits the largest pooled species cluster's genome total as the
