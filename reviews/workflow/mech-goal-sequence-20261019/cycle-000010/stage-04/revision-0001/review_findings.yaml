- finding_id: overlay-readme-example-and-test-fixtures-missing-species-strain-id-binding
  status: open
  issue_url: https://github.com/CultureBotAI/TaxonMech/issues/236
  summary: 'In curation/causal_graphs/README.md, lines 123-133 (''### Species vs. Strain strain_id Binding
    Rule'') state that across the 15 maintained overlays (119 GENE_OR_PROTEIN nodes), the 5 overlays whose
    host TaxonRecord.strains[] contains the BacDive strain record—NCBITaxon_562.yaml (Escherichia coli,
    kgmicrobe.strain:bacdive_155687), NCBITaxon_1423.yaml (Bacillus subtilis, kgmicrobe.strain:bacdive_1156),
    NCBITaxon_287.yaml (Pseudomonas aeruginosa, kgmicrobe.strain:bacdive_12795), and NCBITaxon_2190.yaml
    / NCBITaxon_243232.yaml (Methanocaldococcus jannaschii / DSM 2661, kgmicrobe.strain:bacdive_6981)—populate
    strain_id on all 53 of their GENE_OR_PROTEIN nodes. However, the canonical ''## Overlay File Contract''
    YAML example for identifier: NCBITaxon:562 in curation/causal_graphs/README.md (lines 27-40, node_id:
    lacZ) omits strain_id: kgmicrobe.strain:bacdive_155687, and STAGE2_STAGE3_EXEMPLAR_OVERLAYS in tests/test_causal_graph_overlays.py
    omits strain_id: kgmicrobe.strain:bacdive_155687 on NCBITaxon:562 lacZ (lines 78-92), strain_id: kgmicrobe.strain:bacdive_12795
    on NCBITaxon:287 phzM (lines 198-212), and strain_id: kgmicrobe.strain:bacdive_6981 on NCBITaxon:2190
    mcrA (lines 254-268) while populating strain_id on NCBITaxon:1423 spo0A (line 148; #236, #78).'
  disposition: 'Carry forward to Cycle 10 Stage 5 (resolve_review_findings) for direct documentation and
    test-fixture remediation in curation/causal_graphs/README.md and tests/test_causal_graph_overlays.py
    (#236, #78).'
