- finding_id: gtdb-polyphyly-suffix-synonym-mangling
  status: open
  issue_url: https://github.com/CultureBotAI/TaxonMech/issues/65
  carried_from: gtdb-polyphyly-suffix-synonym-mangling
  summary: src/taxonmech/seed.py lines 1214-1215 replace all underscores in GTDB labels with spaces via
    m['gtdb_label'].split('__', 1)[-1].replace('_', ' '), mangling 15,704 polyphyly-suffixed GTDB cluster
