- finding_id: exemplar-overlay-test-fixtures-missing-host-taxon-expresses-edge-and-curation-history
  status: open
  issue_url: https://github.com/CultureBotAI/TaxonMech/issues/249
  summary: 'All 15 committed causal-graph overlays in curation/causal_graphs/*.yaml
    and the ''## Overlay File Contract'' YAML example in curation/causal_graphs/README.md
    (lines 14-83) include the host TAXON node (node_id: taxon, grounding == tid),
    an incoming host-TAXON RO:0002292 (expresses) edge to every GENE_OR_PROTEIN node,
    and a non-empty curation_history list with boolean llm_assisted, and are validated
    by causal_graph_provenance_problems() in scripts/check_provenance.py (lines 151-212).
    However, STAGE2_STAGE3_EXEMPLAR_OVERLAYS in tests/test_causal_graph_overlays.py
    (lines 61-356, covering NCBITaxon:562, NCBITaxon:1423, NCBITaxon:287, NCBITaxon:2190,
    and NCBITaxon:1859096) omits the host TAXON node and incoming RO:0002292 (expresses)
    edge to each GENE_OR_PROTEIN node (lacZ, spo0A, phzM, mcrA, CNBG_1207) across
    all 5 exemplar fixtures, omits curation_history on 4 of the 5 exemplars (NCBITaxon:1423,
    NCBITaxon:287, NCBITaxon:2190, NCBITaxon:1859096), and omits boolean llm_assisted
    on NCBITaxon:562''s curation_history[0] (lines 121-128), so test_five_exemplar_causal_graph_overlays_roundtrip_and_render()
    cannot run causal_graph_provenance_problems() on STAGE2_STAGE3_EXEMPLAR_OVERLAYS
    without raising provenance errors (#249, #78).'
  disposition: 'Carry forward to Cycle 11 Stage 5 (resolve_review_findings) for direct
    test-fixture and provenance-assertion remediation in tests/test_causal_graph_overlays.py
    (#249, #78).'
