- finding_id: gtdb-closematch-exact-promotion
  status: open
  issue_url: https://github.com/CultureBotAI/TaxonMech/issues/124
  summary: 'Across docs/structured-review-inventory/part-00.tsv..part-13.tsv, 95,766
    records (74,325 from fan-out clusters; e.g., NCBITaxon:2940590, NCBITaxon:206,
    and legacy-reviewed NCBITaxon:33952) carry needs_curation because src/taxonmech/seed.py
    (lines 443-478) promotes skos:closeMatch GTDB species-cluster mappings to EXACT_SYNONYM
    and top-level xrefs without a 1:1 taxon-identity bridge (#124, #63).'
  disposition: 'Carry forward to Stage 5 (resolve_review_findings); requires gating
    closeMatch promotion in src/taxonmech/seed.py and regenerating 95,766 generated
    TaxonRecord YAML files and rendered pages (#124, #63).'
- finding_id: gtdb-polyphyly-suffix-synonym-mangling
  status: open
  issue_url: https://github.com/CultureBotAI/TaxonMech/issues/65
  summary: src/taxonmech/seed.py lines 470-473 replace all underscores in GTDB labels
    with spaces via m['gtdb_label'].split('__', 1)[-1].replace('_', ' '), mangling
    15,704 polyphyly-suffixed GTDB cluster names (e.g., s__Campylobacter_F_sputorum
    -> 'Campylobacter F sputorum' on NCBITaxon:206 and s__Acetobacterium_woodii_A
    -> 'Acetobacterium woodii A' on NCBITaxon:33952) into fake trinomials published
    as EXACT_SYNONYM (#65).
  disposition: Carry forward to Stage 5 (resolve_review_findings); requires updating
    GTDB synonym formatting in src/taxonmech/seed.py and regenerating affected TaxonRecord
    YAML files (#65).
- finding_id: gtdb-pooled-broadmatch-attestation-and-note
  status: open
  issue_url: https://github.com/CultureBotAI/TaxonMech/issues/118
  summary: On 6,335 pooled-only GTDB records (e.g., NCBITaxon:3121604 data/taxa/bacteria/acidaminobacteraceae_bacterium.yaml),
    src/taxonmech/seed.py (lines 579-593) emits the largest pooled species cluster's
    genome total as the taxon's GTDB GENOME attestation (#118), and across 8,587 pooled
    GTDB records (209,540 rows, including NCBITaxon:562 and NCBITaxon:3121604) lines
    465-467 emit a note stating the reverse of kg-microbe's broadMatch direction (#119).
  disposition: 'Carry forward to Stage 5 (resolve_review_findings); requires updating
    pooled GTDB broadMatch handling in src/taxonmech/seed.py and regenerating 8,587
    TaxonRecord YAML files (#118, #119).'
