assessments:
- assessment_id: strain-source-support
  area: evidence
  topic: Exact deposit chains, source record types and accession versions
  outcome: supported
  target_ids:
  - NCBITaxon:572546
  summary: 'BacDive 18097 identifies the AV18 type strain with deposits DSM 5631,
    JCM 9629 and NBRC 100127, preserving species NCBITaxon:84156 separately from strain
    NCBITaxon:572546. The three full deposit identifiers pass pinned CAFI authority/accession
    matching; bare AV18 and Av18 do not. StrainInfo SI-ID47962 version 3 retains three
    available, non-deprecated, non-erroneous deposits: DSM 5631/SI-DP159331, JCM 9629/SI-DP159332
    and NBRC 100127/SI-DP339717. Every imported sequence explicitly names only DSM
    5631/SI-DP159331: unversioned GCA_000025285 is a genome assertion, while AF418134
    and EF442876 remain typed nucleotide references. No sequence is transferred merely
    through the shared SI-ID to JCM or NBRC. GOLD Go0003484 names DSM 5631 in its
    culture field and as a whole token in the verbatim strain field Av18, DSM 5631;
    both evidence paths join Gp0003484 to genome analysis Ga0027555. Its two genomic
    component entries, CP001858 and CP001857, explicitly name the same GCA_000025285.1
    assembly and do not create two assemblies. IMG646311906 has both primary GOLD
    and BacDive support. The additional GOLD organisms Go0622924 and Go0622925 identify
    NBRC 100127 and JCM 9629 without inventing additional sequencing chains. GTDB
    RS_GCF_000025285.1 explicitly names DSM 5631 and preserves GCA_000025285.1. Primary
    NCBI GenBank/RefSeq rows distinguish species and strain taxids, identify DSM 5631,
    and explicitly pair their .1 assemblies as identical. The current NCBI assembly
    summary independently corroborates that pairing, type material, one chromosome
    plus one plasmid, sample SAMN00017459, GenBank project PRJNA32583 and RefSeq project
    PRJNA224116. BV-BRC 572546.12 identifies the complete record, whereas 572546.16
    and 84156.3 are explicitly plasmid records. Whole DSM 5631 tokens support the
    strain joins, including the verbatim AV18; DSM 5631 field in 84156.3. The latter
    has FJ707368 as its source nucleotide accession but no assembly_accession; no
    NCBI assembly is fabricated from it. Separate BV-BRC IDs remain separate database-record
    assertions, not extra complete biological genomes. Current NCBI summaries resolve
    AF418134.1 and EF442876.1 to DSM 5631/taxon572546, sample SAMN00017459 to the
    same strain, and PRJNA32583 to its monoisolate genome project. PRJNA224116 is
    the multispecies RefSeq annotation umbrella and remains typed contextual project
    association. DataCite resolves the exact DOI 10.60712/SI-ID47962.3 to SI-ID47962
    version3. All returned versions remain separate from the native unversioned assertions.
    All 12 genome_assemblies assertions (3 identifier forms), 10 genome_records assertions
    (5 IDs) and 36 related_records assertions (14 IDs) exactly match the pinned inventories;
    these counts are not biological genome counts. The strain record keeps its own
    NCBI rank and parent; the separate GTDB species-to-strain equivalence concern
    does not invalidate these source-supported strain links.'
