  CRC64 120F95F29D5A2698, v2), UniProtKB:Q58194 (HMD_METJA, hmd/MJ0784, EC:1.12.98.2,
  NCBITaxon:243232, UP:UP000000805, 358 aa, CRC64 9D8E789759BCF43A, v1), and UniProtKB:J9VE33
