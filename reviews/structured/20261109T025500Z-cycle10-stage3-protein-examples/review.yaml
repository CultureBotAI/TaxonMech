summary: 'Reviewed all 626,048 in-scope TaxonRecord files across Bacteria (605,695),
  Archaea (14,013), Eukaryota (6,331), and other (9) against the Stage 3 UniProtKB
  protein-examples contract (.claude/skills/add-uniprot-protein-examples/SKILL.md).
  Expanded curation/uniprot_proteins.tsv from 49 to 54 live-verified UniProtKB accessions
  (UniProt release 2026_02), adding reviewed Swiss-Prot proteins UniProtKB:O31661
  (KINE_BACSU, kinE/BSU13530, EC:2.7.13.3, NCBITaxon:224308, UP:UP000001570, 738 aa,
  CRC64 FE27DAB7F08AC64B, v1), UniProtKB:P33883 (LASI_PSEAE, lasI/PA1432, EC:2.3.1.184,
  NCBITaxon:208964, UP:UP000002438, 201 aa, CRC64 DBE8582AF42B9AA6, v1), UniProtKB:P50456
  (MLC_ECOLI, mlc/b1594, NCBITaxon:83333, UP:UP000000625, 406 aa, CRC64 423608797FC980CB,
  v2), UniProtKB:Q56R42 (HOG1_CRYN9, HOG1/CNAG_01523, EC:2.7.11.24, NCBITaxon:235443,
  UP:UP000010091, 365 aa, CRC64 F28E2E95B6DAD6B5, v1), and UniProtKB:Q57766 (FTR_METJA,
  ftr/MJ0318, EC:2.3.1.101, NCBITaxon:243232, UP:UP000000805, 301 aa, CRC64 28207E48812B0296,
  v1). Enriched 11 maintained overlays in curation/causal_graphs/ (NCBITaxon_562,
  NCBITaxon_83333, NCBITaxon_511145, NCBITaxon_1423, NCBITaxon_224308, NCBITaxon_287,
  NCBITaxon_208964, NCBITaxon_2190, NCBITaxon_243232, NCBITaxon_5207, NCBITaxon_235443),
  bringing the 15 maintained overlays from 108 to 119 GENE_OR_PROTEIN nodes (117 carrying
  UP:* reference proteome_id; 2 on Cryptococcus deneoformans B-3501A NCBITaxon:283643
  & species NCBITaxon:40410 omitting proteome_id because strain B-3501A has no UP:UP...
  proteome cross-reference in UniProtKB 2026_02 whereas sibling strain JEC21 NCBITaxon:214684
  has UP:UP000001247) and from 389 to 426 evidence-backed edges. Corpus-wide protein
  example attachment outside the 15 causal-graph records remains inapplicable because
  TaxonRecord has no top-level protein slot and the remaining 626,033 records carry
  causal_graphs: [].'
