  NCBITaxon:224308, UP:UP000001570, 378 aa, CRC64 8712FE59B865AEF4, v2), UniProtKB:Q9HWH1
  (PHZA1_PSEAE, phzA1/PA4210, NCBITaxon:208964, UP:UP000002438, 162 aa, CRC64 8B89D65CDEF67198,
  v1), UniProtKB:O69753 (PHZB1_PSEAE, phzB1/PA4211, NCBITaxon:208964, UP:UP000002438,
  162 aa, CRC64 F641EECE73F0B78F, v1), UniProtKB:P61154 (FWDB_METJA, fwdB/MJ1194,
  EC:1.2.7.12, NCBITaxon:243232, UP:UP000000805, 435 aa, CRC64 C1652D23FFC20970, v2),
  and UniProtKB:J9VQ26 (BZP4_CRYN9, BZP4/CNAG_03346, NCBITaxon:235443, UP:UP000010091,
  341 aa, CRC64 8E34C8525C009CFC, v2). Enriched 11 maintained overlays in curation/causal_graphs/
  (NCBITaxon_562, NCBITaxon_83333, NCBITaxon_511145, NCBITaxon_1423, NCBITaxon_224308,
  NCBITaxon_287, NCBITaxon_208964, NCBITaxon_2190, NCBITaxon_243232, NCBITaxon_5207,
  NCBITaxon_235443), bringing the 15 maintained overlays from 51 to 64 GENE_OR_PROTEIN
  nodes (62 carrying UP:* reference proteome_id; 2 on Cryptococcus deneoformans B-3501A
