summary: 'Reviewed all 626,048 in-scope TaxonRecord files across Bacteria (605,695),
  Archaea (14,013), Eukaryota (6,331), and other (9) against the Stage 3 UniProtKB
  protein-examples contract (.claude/skills/add-uniprot-protein-examples/SKILL.md).
  Expanded curation/uniprot_proteins.tsv from 13 to 17 live-verified UniProtKB accessions
  (UniProt release 2026_02), adding Swiss-Prot proteins UniProtKB:P03023 (LACI_ECOLI,
  lacI/b0345, NCBITaxon:83333, UP:UP000000625, 360 aa, CRC64 347A8DEE92D736CB, v3),
  UniProtKB:P07464 (THGA_ECOLI, lacA/b0342, EC:2.3.1.18, NCBITaxon:83333, UP:UP000000625,
  203 aa, CRC64 31C7FEA0B0150D70, v1), UniProtKB:P06628 (SP0F_BACSU, spo0F/BSU37130,
  EC:2.7.-.-, NCBITaxon:224308, UP:UP000001570, 124 aa, CRC64 4130377E3558D698, v1),
  and UniProtKB:P06535 (SP0B_BACSU, spo0B/BSU27930, EC:2.7.-.-, NCBITaxon:224308,
  UP:UP000001570, 192 aa, CRC64 3A9A38B5FFB55647, v1). Enriched 9 maintained overlays
  in curation/causal_graphs/ (NCBITaxon_562, NCBITaxon_83333, NCBITaxon_511145, NCBITaxon_1423,
  NCBITaxon_224308, NCBITaxon_287, NCBITaxon_208964, NCBITaxon_1859096, NCBITaxon_294750),
  bringing the 15 maintained overlays from 28 to 38 GENE_OR_PROTEIN nodes (36 carrying
  UP:* reference proteome_id; 2 on Cryptococcus deneoformans B-3501A NCBITaxon:283643
  & species NCBITaxon:40410 omitting proteome_id because strain B-3501A has no UP:UP...
  proteome cross-reference in UniProtKB 2026_02 whereas sibling strain JEC21 NCBITaxon:214684
  has UP:UP000001247) and from 88 to 110 evidence-backed edges, while reconciling
  4 PubMed citations against live NCBI PubMed (PMID:1987166 -> PMID:1846779, PMID:11489860
  -> PMID:11591691, PMID:8188694 -> PMID:8007987, PMID:15576787 -> PMID:15643074).
  Corpus-wide protein example attachment outside the 15 causal-graph records remains
  inapplicable because TaxonRecord has no top-level protein slot and the remaining
  626,033 records carry causal_graphs: [].'
