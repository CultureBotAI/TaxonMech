summary: 'Reviewed all 626,048 in-scope TaxonRecord files across Bacteria (605,695),
  Archaea (14,013), Eukaryota (6,331), and other (9) against the Stage 2 causal-graph
  curation contract (.claude/skills/curate-causal-graphs/SKILL.md). Verified that
  all native prerequisite gates pass, including offline UniProtKB reference proteome
  and NCBI Taxonomy lineage validation (curation/uniprot_proteins.tsv and validate_causal_graph_proteins()
  in src/taxonmech/seed.py). Enriched 13 maintained curation/causal_graphs/*.yaml
  overlays across Escherichia coli (NCBITaxon:562, NCBITaxon:83333, NCBITaxon:511145;
  adding edge e13 linking lacZ UniProtKB:P00722 via causally upstream of or within
  RO:0002418 to lactose_catabolism GO:0005990, PMID:8008071), Bacillus subtilis (NCBITaxon:1423,
  NCBITaxon:224308; adding edge e14 linking kinA UniProtKB:P16497 via causally upstream
  of or within RO:0002418 to endospore_formation GO:0034301, PMID:2509430, PMID:1846779),
  Methanocaldococcus jannaschii (NCBITaxon:2190, NCBITaxon:243232; adding edges e9,
  e10, e11 linking mcrA UniProtKB:Q58256, mcrB UniProtKB:Q58252, and mcrG UniProtKB:Q58255
  via causally upstream of or within RO:0002418 to methanogenesis GO:0015948, PMID:9367957),
  Cryptococcus deuterogattii (NCBITaxon:1859096, NCBITaxon:294750; adding edge e6
  linking lac1 UniProtKB:A0A095CIC4 via causally upstream of or within RO:0002418
  to melanin_biosynthesis GO:0042438, PMID:15643074), Cryptococcus deneoformans (NCBITaxon:40410,
  NCBITaxon:283643; adding edge e4 linking lac1 UniProtKB:Q55P57 via causally upstream
  of or within RO:0002418 to melanin_biosynthesis GO:0042438, PMID:8760791), and Cryptococcus
  neoformans (NCBITaxon:5207, NCBITaxon:235443; adding edge e4 linking lac1 UniProtKB:J9VY90
  via causally upstream of or within RO:0002418 to melanin_biosynthesis GO:0042438,
  PMID:15381117), expanding the 15 maintained overlays from 110 to 127 evidence-backed
  edges across 7 cross-domain species exemplars and 8 reference-proteome strains.
  Corpus-wide automated expansion across the remaining 38,342 trait/medium-attested
  records remains source-limited by pre-aggregated 2-column count tables in data/raw/{madin_taxa,bactotraits_taxa}.tsv
  (tracked under #78 / taxonmech-infra-0002).'
