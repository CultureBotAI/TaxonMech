- check_id: optional-inventories
  name: Complete exact identifier and name inventory search
  status: passed
  required: true
  summary: Full direct reads of twelve source/scope/path tables, including ignored
    files, used exact identifiers, full labels, source IDs and pinned descendants.
    The imported strain count 1 is supported by the exact BacDive row and matches
    the native strain block. The source attestations NCBITAXON 1 NAME; LPSN 1 NAME;
    BACDIVE 1 STRAIN; MADIN 5 TRAIT_ASSERTION match their pinned inventory projections.
    The pinned NCBI subtree contains exactly one child strain. Parent and child source
    placement remain explicit; descendant metadata do not establish an additional
    parent-level assertion. The full imported assembly/genome/related assertion sets
    were checked against inventories and primary source records. Historical MADIN
    aggregate counts remain historical projections; they were not reconstructed from
    present primary strain snapshots. Optional inventory misses are limited to the
    named pinned tables and exact queries, not worldwide biological absence.
