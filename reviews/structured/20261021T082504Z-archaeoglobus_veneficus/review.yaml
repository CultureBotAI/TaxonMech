    names and ranks agree with pinned NCBI and the current official EFetch; the remote
    lineage omits only root. The species remains distinct from child SNP6/NCBITaxon:693661.
    BacDive 18098 is imported through that descendant, retaining classified_as rather
    than replacing species identity.
