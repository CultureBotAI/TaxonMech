  summary: 'BacDive 18098 names SNP6, DSM 11195 and the type strain, carrying species
    NCBITaxon:58290 and a separate strain assignment NCBITaxon:693661. The parent
    species import retains classified_as NCBITaxon:693661 and the type-strain flag.
    Whole DSM 11195 passes pinned CAFI matching; bare SNP6 does not. StrainInfo SI-ID
    49048.3 has its own non-erroneous, available DSM 11195/SI-DP 162530, matching
    ccID 1 and non-deprecated collection. Every imported sequence explicitly names
    that same SI-DP: AB274311, AF418132, AF418181, AF482452 and EF442877. AF418181
    retains the source rrnaop type and partial 16S description; the other four remain
    gene-related nucleotide records. The source species taxid 58290 does not erase
    the independently supported SNP6 deposit identity. GOLD Go0003485 gives DSM 11195
    in its culture field and the whole-token strain field SNP6, DSM 11195; both paths
    join Gp0003485 to Ga0024962 and its explicit CP002588/GCA_000194625.1. These are
    distinct evidence assertions for one source chain, not additional biological genomes.
    BacDive retains unversioned GCA_000194625, IMG 2504136002 and BV-BRC 693661.9;
    GOLD supports the same IMG identifier through both fields. Pinned NCBI GenBank
    and BV-BRC records name SNP6/taxon 693661, species 58290, the exact .1 assembly,
    PRJNA51621 and SAMN00713598. Bare SNP6 in those records does not create a direct
    deposit join. Current NCBI corroborates the GCA_000194625.1/GCF_000194625.1 pair
    as identical, complete and from type material, sample SAMN00713598 and SNP6. Project
    PRJNA51621 names SNP6 but is explicitly Multiisolate; preserve contextual project
    scope without claiming exclusive sample membership. Current nucleotide summaries
    return all five .1 accessions, DSM 11195 and species 58290 with source lengths
    1870/864/1451/1829/2099; AF482452 also explicitly retains SNP6. DataCite resolves
    exact SI-ID 49048 version 3. Current versions corroborate identity without rewriting
    unversioned native references. 3 genome_assemblies assertions (2 distinct identifier
    forms); 4 genome_records assertions (2 distinct identifier forms); 17 related_records
    assertions (12 distinct identifier forms). These reproduce every imported inventory
