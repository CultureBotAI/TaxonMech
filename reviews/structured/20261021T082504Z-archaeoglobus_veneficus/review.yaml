limitations:
- No direct IMG response or current culture-availability check was performed. BacDive/GOLD
  IMG assertions are supported as source claims, not independently proven sequence
  equivalence.
- Nucleotide ESummary and BioSample/project/assembly metadata verify identifiers and
  source scope; full sequences, experimental functions, ANI and full publications
  were not reassessed. Gene titles remain typed related-record descriptions rather
  than species-wide causal or physiological claims.
- Assembly accession forms, database record IDs and source assertions are different
  counting units. Repeated source-field evidence does not imply additional biological
  genomes.
- The historical Madin aggregate count agrees with its pinned projection; the original
  edges were not recounted.
- Current authority pages and sequence summaries are observations separate from the
  pinned inventories. Marker accession versions and metadata were checked; no sequence
  alignment or whole-genome identity test was performed.
- Both veneficus publication identifiers and their effective-publication/validation-list
  roles were checked using official LPSN and Crossref metadata; the full papers were
  not read.
- The structured CLI was unavailable in bounded local checks; the official public
  dataset index was inspected instead. No indexed Archaeoglobus dataset matched at
  this capture; this is not negative phenotype, regulation or transcriptomic evidence.
- Actual native gate execution at base 01ca63effdf8c03a644df893ba6129b2d8448ea4; retained
  original cwd, times, commands, log hashes and terminal exit codes identify the executions.
  Reused repository-wide receipts require the explicit same-base/native-input certificate;
  these are historical runs, not new batch-0018 invocations. Missing terminal receipts
  or reuse proof remain unavailable in unsaved previews. Exact-target strict receipts
  retain their original execution context. New review bundles still require individual
  validation/save/check.
