  summary: 'BacDive 18098 names SNP6, DSM 11195 and the type strain, carrying species
    NCBITaxon:58290 and a separate strain assignment NCBITaxon:693661. The own-strain
    record is NCBITaxon:693661; its imported BacDive block appropriately needs no
    classified_as field. The source type-strain evidence remains available without
    requiring a copied parent-level type flag. Whole DSM 11195 passes pinned CAFI
