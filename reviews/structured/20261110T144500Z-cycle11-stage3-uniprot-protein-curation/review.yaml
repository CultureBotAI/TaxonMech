summary: 'Reviewed all 626,048 in-scope TaxonRecord files across Bacteria (605,695),
  Archaea (14,013), Eukaryota (6,331), and other (9) against the Stage 3 UniProtKB
  protein-examples contract (.claude/skills/add-uniprot-protein-examples/SKILL.md).
  Expanded curation/uniprot_proteins.tsv from 54 to 59 live-verified UniProtKB accessions
  (UniProt release 2026_02), adding reviewed Swiss-Prot proteins UniProtKB:P0AEW4
  (CPDA_ECOLI, cpdA/b3032, EC:3.1.4.53, NCBITaxon:83333, UP:UP000000625, 275 aa, CRC64
  97696478536CFBF1, v1), UniProtKB:Q7WY62 (SDA_BACSU, sda/BSU25690, NCBITaxon:224308,
  UP:UP000001570, 52 aa, CRC64 BCBDECF0E0203CAE, v1), UniProtKB:Q9I4X0 (MVFR_PSEAE,
  mvfR/PA1003, NCBITaxon:208964, UP:UP000002438, 332 aa, CRC64 117430C3C1232D97, v1),
  UniProtKB:Q58441 (MTD_METJA, mtd/MJ1035, EC:1.5.98.1, NCBITaxon:243232, UP:UP000000805,
  277 aa, CRC64 93A1D2357CC85DDF, v1), and UniProtKB:J9VHN6 (X325_CRYN9, BIM1/CNAG_02775,
  NCBITaxon:235443, UP:UP000010091, 218 aa, CRC64 0436973FA833B8B2, v1). Also documented
  candidate screening findings (e.g., O35022 is AZOR1_BACSU rather than sda Q7WY62;
  P60495 is PXPB_BACSU rather than kipI; Q9HWH0 is a retired/merged secondary accession;
  Q9I4X4 is not the primary accession for mvfR/pqsR PA1003 Q9I4X0; Q58196 is not mtd
  MJ1035 Q58441). Enriched 11 maintained overlays in curation/causal_graphs/ (NCBITaxon_562,
  NCBITaxon_83333, NCBITaxon_511145, NCBITaxon_1423, NCBITaxon_224308, NCBITaxon_287,
  NCBITaxon_208964, NCBITaxon_2190, NCBITaxon_243232, NCBITaxon_5207, NCBITaxon_235443),
  bringing the 15 maintained overlays from 119 to 130 GENE_OR_PROTEIN nodes (128 carrying
  UP:* reference proteome_id; 2 on Cryptococcus deneoformans B-3501A NCBITaxon:283643
  & species NCBITaxon:40410 omitting proteome_id because strain B-3501A has no UP:UP...
  proteome cross-reference in UniProtKB 2026_02 whereas sibling strain JEC21 NCBITaxon:214684
  has UP:UP000001247) and from 437 to 474 evidence-backed edges. Corpus-wide protein
  example attachment outside the 15 causal-graph records remains inapplicable because
  TaxonRecord has no top-level protein slot and the remaining 626,033 records carry
  causal_graphs: [].'
