    NCBITaxon:92454, unclassified Methanobacteriaceae. The full ten-entry lineage
    retains root, cellular organisms, Archaea, Methanobacteriati, Methanobacteriota,
    Methanomada group, Methanobacteria, Methanobacteriales, Methanobacteriaceae and
    the unclassified family node, with their distinct NO_RANK, CELLULAR_ROOT, DOMAIN,
    KINGDOM, PHYLUM, CLADE, CLASS, ORDER and FAMILY ranks. Every ancestor identifier,
    literal label and rank agrees with pinned NCBI and current official EFetch; EFetch
    omits root. Genetic code 11 agrees. Its family placement is more specific than
    that of the other numbered archaeal placeholders in this batch.
