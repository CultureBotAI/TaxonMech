- assessment_id: strain-assertions
  area: evidence
  topic: Strain, deposit and genome-source links
  outcome: supported
  summary: BacDive5460 explicitly associates BH2, species312540 and strain1295373,
    DSM16651/JCM13668. The strain-specific taxonomy wins for imported filing. StrainInfo297629.3
    explicitly retains DSM deposit691085 and JCM deposit691086, with unversioned GCA_001316225
    attached separately to both. The JCM deposit preserves former LPSN787130/name
    Ferroplasma cupricumulans while the strain and DSM deposit use current788161;
    the homotypic synonym bridge supports this without replacing source-level labels.
    GOLD Go0093115 JCM13668 has projectGp0093115, analysisGa0128368, GCA_001316225.1
    and IMG2681813016; Go0277518 DSM16651 has no project in the complete organism-field
    search. BV1295373.3 uses GCA_001316225.1, PRJDB847 and SAMD00000438; GTDB/RefSeq
    use PRJNA224116 with that same sample. These source-specific project assertions
    coexist. GCA_001402935 is a separate BH2 assembly and is not collapsed with the
    JCM assembly. All twelve assembly, eight genome and twenty-six related assertions
    agree exactly with the imported source multiset. Bare BH2 does not pass CAFI deposit
    normalization; its explicit BacDive genome link remains supported without inventing
    additional direct NCBI/GTDB/BV deposit joins. Here BacDive5460 is directly filed
    under1295373. The absent derived is_type_strain field follows the same-taxon LPSN
    intersection rule; it is not an explicit false claim and does not negate the strain
    being type material for its parent species.
