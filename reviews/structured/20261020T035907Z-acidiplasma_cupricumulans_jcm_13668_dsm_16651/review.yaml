- assessment_id: nomenclature
  area: nomenclature
  topic: Name classes and nomenclatural scope
  outcome: supported
  summary: No same-taxon LPSN nomenclature block is asserted for this NCBI strain.
    Parent species788161 and its former name787130 support the deposit context only.
    LPSN788161 supports the valid ICNP combination (Hawkes et al.2008) Golyshina et
    al.2009, type BH2 with DSM16651/JCM13668 and accessionAY907888. Former name Ferroplasma
    cupricumulans LPSN787130 is a homotypic synonym, not a different deposit. Current
    LPSN explicitly corrects the original article/PMID19628615 DSM16551 typo to DSM16651;
    the record uses the corrected designation. Crossref resolves both publication
    DOIs, and AY907888.1 confirms BH2/taxon312540. The original description distinguishes
    aeolicum and cupricumulans, whereas GTDB groups their genomes in one species cluster;
    that source taxonomy disagreement is retained.
