assessments:
- assessment_id: identity
  area: identity
  topic: Resolved biological taxon and carried lineage
  outcome: supported
  summary: The identifier NCBITaxon:315460 resolves to Acidianus sp. Acii26. The exact
    suffix 26 is retained and is not interchangeable with the neighboring Acii18,
    Acii19 or Acii25 labels; the pinned and fetched NCBI entries agree. The parent
    is unclassified Acidianus (NCBITaxon:2629519); all ten pinned ancestors retain
    the root-first NCBI chain through Acidianus, Sulfolobaceae and Archaea. The fetched
    lineage agrees on every supplied ancestor ID, label and rank, with the root omitted
    by EFetch. Genetic code 11 is also unchanged. The pinned taxon row is data/raw/ncbitaxon_taxa.tsv:64898;
    the fetched NCBI EFetch Taxon element with TaxId=315460 independently agrees.
  target_ids:
  - NCBITaxon:315460
  evidence_ids:
  - record
  - taxonomy-inventory
  - ncbi-live
  - scope-row
  - path-row
  dimensions:
  - name: taxon-rank
    value: SPECIES
    definition: NCBI target rank, distinct from physical strain/deposit/genome identity.
    evidence_ids:
    - record
    - taxonomy-inventory
    - ncbi-live
  - name: taxonomy-snapshot
    value: '2026-09-13'
    definition: Pinned NCBI snapshot; current authority is separately identified.
    evidence_ids:
    - taxonomy-inventory
    - manifest
- assessment_id: nomenclature
  area: nomenclature
  topic: Source-scoped names and nomenclatural standing
  outcome: supported
  summary: The record preserves the exact NCBI scientific-name string Acidianus sp.
    Acii26. The pinned exact, related and broad synonym columns are empty, and the
    inspected EFetch entry supplies no OtherNames element, so no synonym class is
    missing from the declared inputs. Full searches of the pinned LPSN table by NCBI
    CURIE, full label and slug found no matching row. The record makes no LPSN correct-name,
    valid-publication or type-strain assertion; this review does not infer any such
    status from the name alone.
  target_ids:
  - NCBITaxon:315460
  evidence_ids:
  - record
  - taxonomy-inventory
  - ncbi-live
  - lpsn-inventory
  - gtdb-mappings
  - mapping-policy
- assessment_id: completeness
  area: completeness
  topic: Complete imported subtree and source assertion units
  outcome: supported
  summary: For NCBITaxon:315460, full direct reads of the pinned NCBI taxonomy, LPSN
    names, GTDB mapping/species, BacDive strain, culture-collection strain, GOLD,
    MediaDive, Madin and BactoTraits tables found no descendants or optional-source
    rows matching the NCBI CURIE, full taxon label or slug. These reads include ignored
    files and are scoped to the named input tables. The scope and path-lock entries
    resolve this exact record. Zero imported BacDive strains and the single NCBI attestation
    of one NAME therefore agree with the input coverage; one NAME is not a genome
    or biological strain count. No existing strain/deposit association is available
    for a downstream genome join in this record. The complete YAML contains no experimental
    mechanism or gene/pathway assertion requiring a transcriptomic cross-check.
