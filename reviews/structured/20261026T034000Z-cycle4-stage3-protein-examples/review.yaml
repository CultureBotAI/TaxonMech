  Archaea (14,013), Eukaryota (6,331), and other (9) against the Stage 3 UniProtKB
  protein-examples contract (.claude/skills/add-uniprot-protein-examples/SKILL.md).
  Expanded curation/uniprot_proteins.tsv from 17 to 23 live-verified UniProtKB accessions
  (UniProt release 2026_02), adding reviewed Swiss-Prot proteins UniProtKB:P0ACJ8
  (CRP_ECOLI, crp/b3357, NCBITaxon:83333, UP:UP000000625, 210 aa, CRC64 DCBC24FA46C61B3D,
  v1), UniProtKB:Q08430 (KINB_BACSU, kinB/BSU31450, EC:2.7.13.3, NCBITaxon:224308,
  UP:UP000001570, 428 aa, CRC64 52FBECA6864F7040, v4), UniProtKB:P05043 (SP0E_BACSU,
  spo0E/BSU13640, EC:3.1.3.-, NCBITaxon:224308, UP:UP000001570, 85 aa, CRC64 4FDF18420E77B9CF,
  v1), UniProtKB:P0DPB9 (PHZD1_PSEAE, phzD1/PA4213, EC:3.3.2.15, NCBITaxon:208964,
  UP:UP000002438, 207 aa, CRC64 37F33F086022F527, v1), UniProtKB:Q58929 (MER_METJA,
  mer/MJ1534, EC:1.5.98.2, NCBITaxon:243232, UP:UP000000805, 331 aa, CRC64 367B5DFD1EB6EBBD,
  v2), and UniProtKB:J9VQZ4 (LAC2_CRYN9, LAC2/CNAG_03464, EC:1.10.3.2, NCBITaxon:235443,
  UP:UP000010091, 594 aa, CRC64 E71D60C20BD6C102, v2). Enriched 11 maintained overlays
  in curation/causal_graphs/ (NCBITaxon_562, NCBITaxon_83333, NCBITaxon_511145, NCBITaxon_1423,
  NCBITaxon_224308, NCBITaxon_287, NCBITaxon_208964, NCBITaxon_2190, NCBITaxon_243232,
  NCBITaxon_5207, NCBITaxon_235443), bringing the 15 maintained overlays from 38 to
  51 GENE_OR_PROTEIN nodes (49 carrying UP:* reference proteome_id; 2 on Cryptococcus
  deneoformans B-3501A NCBITaxon:283643 & species NCBITaxon:40410 omitting proteome_id
  because strain B-3501A has no UP:UP... proteome cross-reference in UniProtKB 2026_02
  whereas sibling strain JEC21 NCBITaxon:214684 has UP:UP000001247) and from 127 to
  161 evidence-backed edges. Corpus-wide protein example attachment outside the 15
  causal-graph records remains inapplicable because TaxonRecord has no top-level protein
  slot and the remaining 626,033 records carry causal_graphs: [].'
