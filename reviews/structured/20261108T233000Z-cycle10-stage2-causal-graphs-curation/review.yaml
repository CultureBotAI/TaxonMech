summary: 'Reviewed all 626,048 in-scope TaxonRecord files across Bacteria (605,695),
  Archaea (14,013), Eukaryota (6,331), and other (9) against the Stage 2 causal-graph
  curation contract (.claude/skills/curate-causal-graphs/SKILL.md). Verified that
  all native prerequisite gates pass, including offline UniProtKB reference proteome
  and NCBI Taxonomy lineage validation (curation/uniprot_proteins.tsv and validate_causal_graph_proteins()
  in src/taxonmech/seed.py). Enriched 11 maintained curation/causal_graphs/*.yaml
  overlays across Escherichia coli (NCBITaxon:562, NCBITaxon:83333, NCBITaxon:511145;
  adding edge e37 linking ptsG UniProtKB:P69786 via negatively regulates RO:0002212
  to cyaA UniProtKB:P00936, PMID:9371775, PMID:16263707, PMID:17158705), Bacillus
  subtilis (NCBITaxon:1423, NCBITaxon:224308; adding edge e44 linking kinD UniProtKB:O31671
  via directly positively regulates RO:0002629 to spo0F UniProtKB:P06628, PMID:11069677,
  PMID:10411754, PMID:18410285), Pseudomonas aeruginosa (NCBITaxon:287, NCBITaxon:208964;
  adding edge e27 linking lasR UniProtKB:P25084 via positively regulates RO:0002213
  to phenazine_biosynthesis GO:0002047, PMID:8898383, PMID:8522523, PMID:12076794),
  Methanocaldococcus jannaschii (NCBITaxon:2190, NCBITaxon:243232; adding edge e31
  linking mch UniProtKB:Q59030 via causally upstream of or within RO:0002418 to mcr_activity
  GO:0050524, PMID:8688087, PMID:9676239, PMID:9367957), and Cryptococcus neoformans
  (NCBITaxon:5207, NCBITaxon:235443; adding edge e27 linking hob1 UniProtKB:J9VMN6
  via positively regulates RO:0002213 to laccase_activity GO:0052716, PMID:25849373,
  PMID:31575776), expanding the 15 maintained overlays from 378 to 389 evidence-backed
  edges across 7 cross-domain species exemplars and 8 reference-proteome strains (108
  GENE_OR_PROTEIN nodes covering 49 live-verified UniProtKB accessions). Corpus-wide
  automated expansion across the remaining 38,342 trait/medium-attested records remains
  source-limited by pre-aggregated 2-column count tables in data/raw/{madin_taxa,bactotraits_taxa}.tsv
  (tracked under #78 / taxonmech-infra-0002).'
