summary: 'Reviewed all 626,048 in-scope TaxonRecord files across Bacteria (605,695),
  Archaea (14,013), Eukaryota (6,331), and other (9) against the Stage 3 UniProtKB
  protein-examples contract (.claude/skills/add-uniprot-protein-examples/SKILL.md).
  Expanded curation/uniprot_proteins.tsv from 44 to 49 live-verified UniProtKB accessions
  (UniProt release 2026_02), adding reviewed Swiss-Prot proteins UniProtKB:J9VMN6
  (HOB1_CRYN9, HOB1/CNAG_01431, NCBITaxon:235443, UP:UP000010091, 591 aa, CRC64 3796CCEF0FF11AD4,
  v1), UniProtKB:O31671 (KIND_BACSU, kinD/BSU13660, EC:2.7.13.3, NCBITaxon:224308,
  UP:UP000001570, 506 aa, CRC64 4A93A6A4500C179A, v1), UniProtKB:P25084 (LASR_PSEAE,
  lasR/PA1430, NCBITaxon:208964, UP:UP000002438, 239 aa, CRC64 28B6E06E9187924A, v1),
  UniProtKB:P69786 (PTGCB_ECOLI, ptsG/b1101, EC:2.7.1.199, NCBITaxon:83333, UP:UP000000625,
  477 aa, CRC64 D97A80FD64B74F73, v1), and UniProtKB:Q59030 (MCH_METJA, mch/MJ1636,
  EC:3.5.4.27, NCBITaxon:243232, UP:UP000000805, 323 aa, CRC64 C793B6CF432BA31F, v1).
  Enriched 11 maintained overlays in curation/causal_graphs/ (NCBITaxon_562, NCBITaxon_83333,
  NCBITaxon_511145, NCBITaxon_1423, NCBITaxon_224308, NCBITaxon_287, NCBITaxon_208964,
  NCBITaxon_2190, NCBITaxon_243232, NCBITaxon_5207, NCBITaxon_235443), bringing the
  15 maintained overlays from 97 to 108 GENE_OR_PROTEIN nodes (106 carrying UP:* reference
  proteome_id; 2 on Cryptococcus deneoformans B-3501A NCBITaxon:283643 & species NCBITaxon:40410
  omitting proteome_id because strain B-3501A has no UP:UP... proteome cross-reference
  in UniProtKB 2026_02 whereas sibling strain JEC21 NCBITaxon:214684 has UP:UP000001247)
  and from 345 to 378 evidence-backed edges. Corpus-wide protein example attachment
  outside the 15 causal-graph records remains inapplicable because TaxonRecord has
  no top-level protein slot and the remaining 626,033 records carry causal_graphs:
  [].'
