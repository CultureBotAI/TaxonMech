# Where the upstream source data lives.
#
# TaxonMech does not vendor kg-microbe's KGX dumps (they are multi-gigabyte).
# scripts/extract_source_inventory.py reads them from a local kg-microbe
# checkout and emits the small, reviewable inventories under data/raw/, which
# ARE committed. Only re-extraction needs this path; seeding, validation and
# tests run entirely off data/raw/.
#
# Resolution order: --kg-microbe flag > KG_MICROBE_ROOT env var > this file.
kg_microbe_root: ~/Documents/VIMSS/ontology/KG-Hub/KG-Microbe/kg-microbe

# Upstream provenance for the inventories, recorded so a reader can tell which
# resource each committed TSV came from. The per-file bytes/mtime/sha256 of the
# actual inputs are captured in data/raw/MANIFEST.yaml at extraction time.
sources:
  ncbitaxon:
    name: NCBI Taxonomy (labels, parents, synonyms)
    url: https://www.ncbi.nlm.nih.gov/taxonomy
    via: kg-microbe data/transformed/ontologies/ncbitaxon_{nodes,edges}.tsv
  ncbitaxon_ranks:
    name: NCBI Taxonomy ranks (has_rank), not carried by the KGX transform
    url: https://www.ncbi.nlm.nih.gov/taxonomy
    via: kg-microbe data/raw/ncbitaxon.db (semantic-sql build of ncbitaxon.owl)
  gtdb:
    name: Genome Taxonomy Database species, genomes and NCBI mappings
    url: https://gtdb.ecogenomic.org/
    via: kg-microbe data/transformed/gtdb/{nodes,edges}.tsv
  gtdb_strain_genomes:
    name: GTDB genome metadata with explicit culture-deposit identifiers
    url: https://data.gtdb.ecogenomic.org/releases/latest/
    via: kg-microbe data/raw/gtdb/{bac120,ar53}_metadata.tsv.gz
  culture_collection_authorities:
    name: DSMZ CAFI collection acronyms, synonyms and accession formats (validation only)
    url: https://github.com/LeibnizDSMZ/cafi/tree/effeca350ac72faeb01d19c2c14830a905c5d116
    via: src/taxonmech/data/cafi_acronyms.json (CC-BY-4.0; attribution in adjacent metadata JSON)
  lpsn:
    name: LPSN names, authorities, type strains and mappings
    url: https://lpsn.dsmz.de/
    via: kg-microbe data/transformed/lpsn/{nodes,edges}.tsv
  lpsn_api:
    name: LPSN API nomenclatural status, publications and sequence accessions
    url: https://api.lpsn.dsmz.de/
    via: kg-microbe data/transformed/lpsn_api/{nodes,edges}.tsv
  bacdive:
    name: BacDive strains and culture-collection deposits
    url: https://bacdive.dsmz.de/
    via: kg-microbe data/transformed/bacdive/{nodes,edges}.tsv
  bacdive_assemblies:
    name: BacDive strain-to-genome links (NCBI assemblies, PATRIC/BV-BRC and IMG records)
    url: https://bacdive.dsmz.de/
    via: kg-microbe data/raw/bacdive_strains.json (Sequence information / Genome sequences)
  mediadive:
    name: MediaDive growth-medium links
    url: https://mediadive.dsmz.de/
    via: kg-microbe data/transformed/mediadive/edges.tsv
  gold:
    name: JGI GOLD organisms
    url: https://gold.jgi.doe.gov/
    via: kg-microbe data/transformed/gold/edges.tsv
  gold_strain_genomes:
    name: GOLD primary organism, sequencing-project and analysis-project relationships
    url: https://gold.jgi.doe.gov/download?mode=site_excel
    via: data/source_snapshots/goldData.xlsx (direct public download; --gold-workbook or GOLD_WORKBOOK override)
  madin_etal:
    name: Madin et al. prokaryotic phenotypic trait compilation
    url: https://doi.org/10.1038/s41597-020-0497-4
    via: kg-microbe data/transformed/madin_etal/edges.tsv
  bactotraits:
    name: BactoTraits functional trait database
    url: https://doi.org/10.1016/j.ecolind.2021.108047
    via: kg-microbe data/transformed/bactotraits/edges.tsv
