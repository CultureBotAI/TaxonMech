causal_graphs:
- graph_id: lactose_catabolism
  title: LacY/LacZ-mediated lactose transport and catabolism
  description: Canonical Escherichia coli K-12 lactose transport and catabolic mechanism
    mediated by lactose permease (LacY, encoded by lacY / b0343 in the K-12 reference
    proteome UP:UP000000625) and beta-galactosidase (LacZ, encoded by lacZ / b0344),
    which import lactose across the inner membrane, hydrolyze lactose into D-glucose
    and D-galactose, and isomerize lactose to allolactose.
