  - edge_id: e19
    subject: cyaA
    predicate: positively regulates
    predicate_id: RO:0002213
    object: crp
    evidence:
    - reference: PMID:6393056
      notes: Adenylate cyclase CyaA (EC:4.6.1.1) synthesizes cyclic AMP (cAMP) from
