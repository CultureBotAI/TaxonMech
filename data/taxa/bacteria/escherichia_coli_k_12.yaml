      notes: CyaA-catalyzed cAMP synthesis relieves catabolite repression and drives
        cAMP-CRP-dependent induction of the Escherichia coli K-12 lacZYA lactose catabolic
        operon.
    - reference: PMID:1646077
      notes: cAMP-CRP transcriptional activation at lacP1 is required for maximal
        expression of the lactose transport and catabolic pathway in Escherichia coli
        K-12.
