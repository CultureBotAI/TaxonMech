      notes: cAMP-activated CRP directly contacts the RNA polymerase alpha subunit
        C-terminal domain to activate transcription at the Escherichia coli K-12 lacP1
        promoter.
  - edge_id: e20
    subject: cyaA
    predicate: causally upstream of or within
