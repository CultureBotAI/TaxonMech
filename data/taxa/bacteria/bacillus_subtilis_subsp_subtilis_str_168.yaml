causal_graphs:
- graph_id: endospore_formation
  title: KinA/Spo0A-regulated endospore formation
  description: Master regulatory mechanism of endospore formation in Bacillus subtilis
    subsp. subtilis str. 168, where sporulation histidine kinase KinA (BSU13990 in
    reference proteome UP:UP000001570) initiates the multicomponent phosphorelay that
    phosphorylates Stage 0 sporulation protein A (Spo0A, BSU24220) to activate sporulation
    gene expression and confer the spore-forming phenotype.
