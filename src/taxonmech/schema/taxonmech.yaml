      TRIBE:
      VARIETAS:
      NO_RANK:

  GroundingStatusEnum:
    description: >-
      Quality of the link between this record's `identifier` and the concept
      it harmonizes.
    permissible_values:
      EXACT:
        description: The identifier is an exact match for the concept (an NCBI taxon).
      CLOSE:
        description: Close but not exact.
      UNGROUNDED:
        description: >-
          No NCBI taxon; the record carries a minted `taxonmech:` identifier.
      NOT_APPLICABLE:
        description: The source concept is not a taxon.

  MappingStatusEnum:
    description: Curation lifecycle for a record.
    permissible_values:
      SEEDED:
        description: >-
          Generated from the source inventories in data/raw/ by
          scripts/seed_from_sources.py; not yet curator-reviewed.
      PROPOSED:
        description: Curator-proposed taxon not present in any source.
      REVIEWED:
        description: Curator has signed off on identity, nomenclature and mappings.
      DEPRECATED:
        description: Superseded by another TaxonRecord; see `replaces` on the successor.

  SynonymTypeEnum:
    permissible_values:
      EXACT_SYNONYM:
      NARROW_SYNONYM:
      BROAD_SYNONYM:
      RELATED_SYNONYM:

  CausalNodeTypeEnum:
    description: >-
      Broad categories for nodes in taxon mechanism graphs — a superset of
      TraitMech's and HabitatMech's enums so graphs stay comparable across
      the Mech repos.
    permissible_values:
      TAXON:
        description: An organism, strain or clade.
      TRAIT:
        description: A microbial trait (a TraitMech or METPO term).
      HABITAT:
        description: A habitat or environmental context (a HabitatMech or ENVO term).
      ENVIRONMENTAL_PARAMETER:
        description: A physicochemical axis of a habitat (salinity, pH, temperature).
      PATHWAY:
        description: A pathway or pathway-like mechanism.
      ENVIRONMENTAL_FACTOR:
        description: An environmental exposure or stressor that is not a measured parameter.
      EXPERIMENTAL_FACTOR:
        description: An assay, perturbation, or experimental condition.
      GENE_OR_PROTEIN:
        description: A gene, protein, gene product, or protein complex.
      CHEMICAL:
        description: A chemical entity.
      CELLULAR_LOCALIZATION:
        description: A cellular component or localization.
      MOLECULAR_FUNCTION:
        description: A molecular activity or function.
      BIOLOGICAL_PROCESS:
        description: A biological process.
      STATE:
        description: A bioenergetic or molecular state of the cell mediating a mechanism.
      QUALITY:
        description: A measurable attribute of a cellular component that modulates the mechanism.
      CAPACITY:
        description: A metabolic or functional capacity.
      COMMUNITY_PROCESS:
        description: A process at the community rather than the cell level.
